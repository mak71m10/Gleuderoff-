appId: com.gleuderoff.editor
productName: Gleuderoff
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: resources/default-world
    to: default-world
asar: true
# только нужные переводы Chromium: −38 МБ; иначе 32-битный упаковщик NSIS не может открыть архив целиком
electronLanguages:
  - ru
  - en-US
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Gleuderoff
  artifactName: Gleuderoff-Setup-${version}.exe
